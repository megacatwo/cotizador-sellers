<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotización para Sellers</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#040d20;
    font-family:Arial, Helvetica, sans-serif;
    color:white;

    display:flex;
    justify-content:center;

    min-height:100vh;
}


/* =========================
   CONTENEDOR PRINCIPAL
========================= */

.web{

    width:100%;
    max-width:900px;

    background:
    linear-gradient(
        180deg,
        #06142c,
        #041126
    );

    min-height:100vh;

}


/* =========================
   PARTE FUTURAMA
========================= */

.banner{

    width:100%;

    aspect-ratio:1152 / 410;

    background-image:url("banner.png");

    background-size:100% auto;

    background-repeat:no-repeat;

    background-position:top center;

}


/* =========================
   CALCULADORA
========================= */

.calculadora{

    margin:0 25px 30px 25px;

    padding:28px;

    border:2px solid #07558e;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        #06172f,
        #041329
    );

    box-shadow:
    0 0 25px rgba(0,200,255,.08);

}


/* =========================
   CAMPOS
========================= */

.grupo{

    margin-bottom:28px;

}

.titulo-campo{

    display:flex;
    align-items:center;

    gap:12px;

    margin-bottom:10px;

    font-size:17px;

    font-weight:bold;

    color:#ffffff;

}


/* ICONO */

.icono{

    width:42px;
    height:42px;

    border:3px solid #00e5ff;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    color:#00e5ff;

    font-size:25px;

    font-weight:bold;

}


/* INPUT */

input{

    width:100%;

    height:62px;

    padding:0 20px;

    border-radius:13px;

    border:2px solid #078df5;

    background:#071831;

    color:white;

    font-size:21px;

    outline:none;

    transition:.2s;

}

input:focus{

    border-color:#00edff;

    box-shadow:
    0 0 14px rgba(0,229,255,.45);

}

input::placeholder{

    color:#6884a8;

}


/* SACAMOS FLECHAS */

input::-webkit-inner-spin-button,
input::-webkit-outer-spin-button{

    -webkit-appearance:none;
    margin:0;

}

input[type=number]{

    -moz-appearance:textfield;

}


/* =========================
   PRECIO
========================= */

.resultado{

    margin-top:35px;

    border:2px solid #00e7bf;

    border-radius:18px;

    background:
    linear-gradient(
        120deg,
        #07332f,
        #06233a
    );

    min-height:145px;

    padding:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


/* LADO IZQUIERDO */

.resultado-info{

    flex:1;

}

.resultado-titulo{

    color:#ffffff;

    font-size:17px;

    font-weight:bold;

    margin-bottom:5px;

}

.contado{

    font-size:35px;

    font-weight:bold;

    color:white;

}

.descripcion{

    margin-top:7px;

    color:#aab8cc;

    font-size:14px;

}


/* DIVISOR */

.divisor{

    width:2px;

    height:85px;

    background:#00d7d7;

    margin:0 30px;

}


/* PRECIO */

.precio{

    min-width:270px;

    text-align:center;

    font-size:48px;

    font-weight:bold;

    color:#ffd600;

    white-space:nowrap;

    text-shadow:
    0 0 12px rgba(255,215,0,.25);

}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .calculadora{

        margin:0 10px 20px 10px;

        padding:18px;

    }

    .titulo-campo{

        font-size:14px;

    }

    .icono{

        width:36px;
        height:36px;

        font-size:20px;

    }

    input{

        height:55px;

        font-size:18px;

    }

    .resultado{

        flex-direction:column;

        text-align:center;

        gap:15px;

    }

    .divisor{

        width:80%;
        height:2px;

        margin:5px 0;

    }

    .precio{

        min-width:0;

        font-size:39px;

    }

    .contado{

        font-size:29px;

    }

}

</style>

</head>


<body>


<div class="web">


    <!-- IMAGEN FUTURAMA -->

    <div class="banner"></div>



    <!-- COTIZADOR REAL -->

    <div class="calculadora">


        <!-- YENES -->

        <div class="grupo">

            <div class="titulo-campo">

                <div class="icono">¥</div>

                VALOR EN YENES (JPY)

            </div>

            <input
                id="yen"
                type="number"
                inputmode="decimal"
                placeholder="Ej: 2500"
                oninput="calcular()"
            >

        </div>



        <!-- PESO -->

        <div class="grupo">

            <div class="titulo-campo">

                <div class="icono">⚖</div>

                PESO EN GRAMOS

            </div>

            <input
                id="peso"
                type="number"
                inputmode="decimal"
                placeholder="Ej: 350"
                oninput="calcular()"
            >

        </div>



        <!-- RESULTADO -->

        <div class="resultado">


            <div class="resultado-info">

                <div class="resultado-titulo">
                    PRECIO TOTAL DE
                </div>

                <div class="contado">
                    Al contado
                </div>

                <div class="descripcion">

                    Precio incluye TODO:
                    producto / envío / comisión

                </div>

            </div>


            <div class="divisor"></div>


            <div
                class="precio"
                id="precio"
            >

                S/ 0.00

            </div>


        </div>


    </div>


</div>



<script src="calculo.js"></script>


</body>

</html>
